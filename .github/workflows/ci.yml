name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: kalio_runtime=debug

jobs:

  # ── Rust: fmt + clippy + build ─────────────────────────────────────────
  rust:
    name: Rust check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu

      - name: Install SDL2 + cross tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all --features desktop-debug -- -D warnings

      - name: build (x86_64 desktop-debug)
        run: cargo build --all --features desktop-debug

      - name: build (ARM64 release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cargo build -p kalio-runtime --release --target aarch64-unknown-linux-gnu

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: kalio-runtime-aarch64
          path: target/aarch64-unknown-linux-gnu/release/kalio-runtime

  # ── Go: dev-server ─────────────────────────────────────────────────────
  go:
    name: Go dev-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: tidy + build
        run: |
          cd tools/dev-server
          go mod tidy
          go build ./...
          go vet ./...
