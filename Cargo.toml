[workspace]
members = [
    "runtime",
    "launcher",
    "sdk",
    "apps/hello",
    "shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Radomiej"]
license = "MIT"

[workspace.dependencies]
# Rendering
sdl2 = { version = "0.37", features = ["ttf", "image", "mixer"] }

# Layout — pure Rust flexbox/grid (Yoga alternative)
taffy = "0.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# WebSocket client
tokio-tungstenite = "0.23"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# Lua 5.4 scripting (vendored — no system Lua needed)
mlua = { version = "0.9", features = ["lua54", "vendored"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Internal
kalio-shared = { path = "shared" }
kalio-sdk    = { path = "sdk" }
